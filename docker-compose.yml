version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-dashboard-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_secret_pg}
      POSTGRES_DB: ${POSTGRES_DB:-hr_dashboard}
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr_admin} -d ${POSTGRES_DB:-hr_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: